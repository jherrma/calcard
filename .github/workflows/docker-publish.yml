name: Docker publish

# Manual only: build the server image and push it to Docker Hub.
# Run from Actions → "Docker publish" → Run workflow, pick the version tag and
# the platforms (both are ticked by default). Each platform is built natively on
# its own runner; the per-platform images are then joined into one tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag and MCP serverInfo.version (e.g. dev, 1.0.2)
        required: true
        default: dev
        type: string
      linux_amd64:
        description: Build linux/amd64 (ubuntu-latest)
        type: boolean
        default: true
      linux_arm64:
        description: "Build linux/arm64 (native ubuntu-24.04-arm runner)"
        type: boolean
        default: true
      set_latest:
        description: Also set the latest tag on the pushed image
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKER_HUB_USERNAME }}/calcard

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          AMD64: ${{ inputs.linux_amd64 }}
          ARM64: ${{ inputs.linux_arm64 }}
        run: |
          entries=()
          if [ "$AMD64" = "true" ]; then
            entries+=('{"platform":"linux/amd64","runner":"ubuntu-latest","suffix":"amd64"}')
          fi
          if [ "$ARM64" = "true" ]; then
            entries+=('{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","suffix":"arm64"}')
          fi
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "Select at least one platform" >&2
            exit 1
          fi
          echo "matrix={\"include\":[$(IFS=,; echo "${entries[*]}")]}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ inputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Record the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Create the multi-platform tag
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ inputs.version }}
          SET_LATEST: ${{ inputs.set_latest }}
        run: |
          sources=()
          for d in *; do
            sources+=("$IMAGE@sha256:$d")
          done
          tags=(-t "$IMAGE:$VERSION")
          if [ "$SET_LATEST" = "true" ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
