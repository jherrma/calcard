# CalCard end-to-end suite — see README.md. Normally started through ./run.
[pytest]
testpaths = tests
python_files = test_[0-9][0-9]_*.py
pythonpath = .
# Our own result lines replace pytest's progress output (conftest.py);
# failure details are printed inline, so no traceback section at the end.
addopts = -p no:cacheprovider -q --tb=no -rN
console_output_style = classic
xfail_strict = true
markers =
    known(fid): fails because of a documented server bug (e2e/FINDINGS.md)
