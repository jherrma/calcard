  /contacts/search:
    get:
      description: |-
        Searches every address book the caller can read — their own AND
        books shared with them (#162). It used to be owner-scoped, which
        made a contact in a shared book vanish as soon as you searched
        for it even though the same contact was listed and editable.

        The optional addressbook_id narrows the search to one book, given
        as its UUID (#52). A UUID that is not among the readable books —
        unknown, deleted, or simply not shared with the caller — is a 404,
        so a narrowing request is never silently answered about other books.
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - description: Limit (default 20, max 200)
        in: query
        name: limit
        type: integer
      - description: Restrict to one address book, by UUID
        in: query
        name: addressbook_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_jherrma_caldav-server_internal_usecase_contact.SearchOutput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_adapter_http.ErrorResponseBody'
        "404":
          description: addressbook_id names a book the caller cannot read
          schema:
            $ref: '#/definitions/internal_adapter_http.ErrorResponseBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_adapter_http.ErrorResponseBody'
      security:
      - BearerAuth: []
      summary: Search contacts
      tags:
      - Contacts
  /public/calendar/{token}:
    get:
      description: Get calendar events in iCalendar format via public token
      parameters:
      - description: Public Token or Token.ics
        in: path
        name: token
        required: true
        type: string
      produces:
      - text/calendar
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Calendar not found
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
      summary: Get public calendar feed
      tags:
      - Public
  /search:
    get:
      description: |-
        Searches events, contacts, calendars and address books for the authenticated user in one request.

        Events are searched across every calendar the caller can read — owned and shared — over their
        denormalized summary, location and description, with **no implicit date bound**: pass `start`/`end`
        only if a window is actually wanted. Contacts are searched across every readable address book,
        including books shared with the caller.

        Each matching recurring series is returned once, represented by the occurrence that best describes
        it: the first occurrence at or after now, or the last one for a series wholly in the past. The
        occurrence carries its own `recurrence_id`, so a client can open it directly instead of the series
        master.

        Ranking: upcoming occurrences first (soonest first), then past ones (most recent first). Contacts are
        ordered by name, collections by the order the list endpoints return.

        `limit` and `offset` apply per group and `limit` is capped at 100 (echoed as `max_limit`); each group
        reports `has_more` rather than truncating silently.
      parameters:
      - description: Search text (minimum 2 characters)
        in: query
        name: q
        required: true
        type: string
      - description: 'Comma-separated subset of events,contacts,calendars,addressbooks
          (default: all)'
        in: query
        name: types
        type: string
      - description: Maximum items per group (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Items to skip per group (default 0)
        in: query
        name: offset
        type: integer
      - description: Optional lower bound for events (RFC 3339)
        in: query
        name: start
        type: string
      - description: Optional upper bound for events (RFC 3339)
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapter_http.SearchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_adapter_http.ErrorResponseBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_adapter_http.ErrorResponseBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_adapter_http.ErrorResponseBody'
      security:
      - BearerAuth: []
      summary: Unified search
      tags:
      - Search
