services:
  caldav:
    image: herrj/calcard:latest
    # The image runs as a non-root user (uid/gid 1000). A bind-mounted data
    # directory must be writable by it. On a NAS (e.g. Synology) either
    # `chown 1000:1000` the host folder, or run as the folder's owner:
    #   user: "1026:100"   # <uid>:<gid> — `ls -ln` shows them
    # To build from source instead (context is the repo root so the image can
    # bundle the web UI), replace `image:` with:
    #   build:
    #     context: ..
    #     dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CALDAV_SERVER_HOST=0.0.0.0
      - CALDAV_SERVER_PORT=8080
      - CALDAV_DB_HOST=postgres
      - CALDAV_DB_PORT=5432
      - CALDAV_DB_USER=caldav
      - CALDAV_DB_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env}
      - CALDAV_DB_NAME=caldav
      - CALDAV_DB_SSLMODE=disable
      - CALDAV_JWT_SECRET=${CALDAV_JWT_SECRET:-}
      # Public URL clients reach this server at, e.g. https://cal.example.com.
      # Optional: left empty, the URLs the server hands out (the DAV server URL
      # shown with a new app password, public calendar links) follow the
      # address each request came in on. REQUIRED once SMTP or OAuth is configured:
      # e-mailed links and OAuth redirect URIs are never taken from a request.
      - CALDAV_BASE_URL=${CALDAV_BASE_URL:-}
      # Only behind a reverse proxy that terminates TLS and overwrites
      # X-Forwarded-Proto / X-Forwarded-Host (clients could forge them otherwise):
      # - CALDAV_TRUST_FORWARDED_HEADERS=true
      # Optional: require this token for first-run setup and keep registration locked
      # until the first account exists. Recommended if the server is reachable from the
      # internet; leave unset on a private network.
      # - CALDAV_SETUP_TOKEN=change-me-to-a-long-random-string
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=caldav
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env}
      - POSTGRES_DB=caldav
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caldav -d caldav"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
