services:
  caldav:
    image: herrj/calcard:latest
    # The image runs as a non-root user (uid/gid 1000). A bind-mounted data
    # directory must be writable by it. On a NAS (e.g. Synology) either
    # `chown 1000:1000` the host folder, or run as the folder's owner:
    #   user: "1026:100"   # <uid>:<gid> — `ls -ln` shows them
    # To build from source instead (context is the repo root so the image can
    # bundle the web UI), replace `image:` with:
    #   build:
    #     context: ..
    #     dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CALDAV_SERVER_HOST=0.0.0.0
      - CALDAV_SERVER_PORT=8080
      - CALDAV_DATA_DIR=/data
      # The app generates and persists a JWT secret on first start (H14), so no
      # insecure default is needed. Set this only to pin a specific secret
      # (e.g. across replicas behind a load balancer).
      - CALDAV_JWT_SECRET=${CALDAV_JWT_SECRET:-}
      - CALDAV_BASE_URL=${CALDAV_BASE_URL:-http://localhost:8080}
      # Optional: require this token for first-run setup and keep registration locked
      # until the first account exists. Recommended if the server is reachable from the
      # internet; leave unset on a private network.
      # - CALDAV_SETUP_TOKEN=change-me-to-a-long-random-string
    volumes:
      - caldav_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  caldav_data:
